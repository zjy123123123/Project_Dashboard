<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>综合运营看板</title>
<script src="echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:#f0f2f5;color:#333;min-height:100vh}

/* 一级导航 */
.top-header{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:20px 24px;text-align:center}
.top-header h1{font-size:26px;font-weight:600;margin-bottom:14px}
.top-nav{display:flex;gap:16px;justify-content:center}
.top-btn{padding:12px 36px;border:2px solid rgba(255,255,255,.4);border-radius:10px;background:rgba(255,255,255,.1);color:#fff;font-size:16px;cursor:pointer;transition:all .3s;font-weight:500}
.top-btn:hover{background:rgba(255,255,255,.25)}
.top-btn.active-du{background:#1a73e8;border-color:#1a73e8;color:#fff}
.top-btn.active-yy{background:#0f9d58;border-color:#0f9d58;color:#fff}

/* 看板容器 */
.board{display:none;padding:0}
.board.active{display:block}

/* 二级导航 */
.sub-header{padding:16px 24px 0;text-align:center}
.sub-nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sub-btn{padding:9px 22px;border:2px solid;border-radius:8px;background:#fff;font-size:14px;cursor:pointer;transition:all .3s}
.sub-btn.du{border-color:#1a73e8;color:#1a73e8}
.sub-btn.du:hover,.sub-btn.du.active{background:#1a73e8;color:#fff}
.sub-btn.yy{border-color:#0f9d58;color:#0f9d58}
.sub-btn.yy:hover,.sub-btn.yy.active{background:#0f9d58;color:#fff}

/* 区块 */
.section{display:none;padding:24px;max-width:1400px;margin:0 auto}
.section.active{display:block}

/* 卡片 */
.cards-row{display:grid;gap:16px;margin-bottom:24px}
.cards-row.c5{grid-template-columns:repeat(5,1fr)}
.cards-row.c4{grid-template-columns:repeat(4,1fr)}
.cards-row.c3{grid-template-columns:repeat(3,1fr)}
.card{background:#fff;border-radius:12px;padding:20px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.08);transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.card .num{font-size:34px;font-weight:700;margin:8px 0}
.card .label{font-size:13px;color:#666}
.card.c-blue .num{color:#1a73e8}
.card.c-green .num{color:#34a853}
.card.c-orange .num{color:#fbbc04}
.card.c-red .num{color:#ea4335}
.card.c-purple .num{color:#9c27b0}
.card.c-teal .num{color:#009688}
.card.c-indigo .num{color:#3f51b5}

/* 图表 */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.chart-box{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.08);height:350px}

/* 筛选 */
.filter-row{display:flex;gap:8px;margin-bottom:16px;justify-content:center;flex-wrap:wrap}
.filter-btn{padding:8px 18px;border:1px solid #ddd;border-radius:20px;background:#fff;cursor:pointer;font-size:13px;transition:all .2s;white-space:nowrap}
.filter-btn:hover{border-color:#1a73e8;color:#1a73e8}
.filter-btn.active-du{background:#1a73e8;color:#fff;border-color:#1a73e8}
.filter-btn.active-yy{background:#0f9d58;color:#fff;border-color:#0f9d58}

/* 表格 */
.table-wrap{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th{background:#f8f9fa;padding:13px 12px;text-align:left;font-size:13px;color:#555;border-bottom:2px solid #e8eaed;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #f0f0f0;font-size:13px}
tr:hover td{background:#f8f9fa}
tr.clickable{cursor:pointer}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500}
.tag-green{background:#e6f4ea;color:#34a853}
.tag-blue{background:#e8f0fe;color:#1a73e8}
.tag-orange{background:#fef7e0;color:#f9ab00}
.tag-red{background:#fce8e6;color:#ea4335}
.tag-purple{background:#f3e8fd;color:#9c27b0}
.tag-gray{background:#f1f3f4;color:#5f6368}

/* 弹窗 */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:32px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto;position:relative}
.modal h3{margin-bottom:16px}
.modal.du h3{color:#1a73e8}
.modal.yy h3{color:#0f9d58}
.modal p{line-height:1.8;color:#555}
.modal-close{position:absolute;top:12px;right:16px;font-size:24px;cursor:pointer;color:#999;background:none;border:none}
.modal-close:hover{color:#333}

@media(max-width:768px){.cards-row.c4,.cards-row.c5,.cards-row.c3{grid-template-columns:repeat(2,1fr)}.charts-row{grid-template-columns:1fr}.top-nav{flex-direction:column;align-items:center}}
</style>
</head>
<body>

<!-- ====== 一级导航 ====== -->
<div class="top-header">
  <h1>📊 综合运营看板</h1>
  <div class="top-nav">
    <button class="top-btn active-du" data-board="board-du">📋 任务督办看板</button>
    <button class="top-btn" data-board="board-yy">📈 运营台账看板</button>
  </div>
</div>

<!-- ====== 任务督办看板 ====== -->
<div id="board-du" class="board active">
  <div class="sub-header">
    <div class="sub-nav">
      <button class="sub-btn du active" data-section="sec-year">26年任务分解</button>
      <button class="sub-btn du" data-section="sec-week">周例会任务</button>
      <button class="sub-btn du" data-section="sec-month">月例会任务</button>
    </div>
  </div>

  <!-- 26年任务分解 -->
  <div id="sec-year" class="section active">
    <div class="cards-row c4">
      <div class="card c-blue"><div class="label">总任务</div><div class="num" id="year-total"></div></div>
      <div class="card c-green"><div class="label">已完成</div><div class="num" id="year-done"></div></div>
      <div class="card c-orange"><div class="label">进行中</div><div class="num" id="year-progress"></div></div>
      <div class="card c-red"><div class="label">已逾期</div><div class="num" id="year-overdue"></div></div>
    </div>
    <div class="charts-row">
      <div class="chart-box" id="year-pie"></div>
      <div class="chart-box" id="year-bar"></div>
    </div>
    <div class="filter-row" id="year-filters">
      <button class="filter-btn active-du" data-filter="全部">全部</button>
      <button class="filter-btn" data-filter="已完成">已完成</button>
      <button class="filter-btn" data-filter="进行中">进行中</button>
      <button class="filter-btn" data-filter="已逾期">已逾期</button>
    </div>
    <div class="table-wrap"><table><thead><tr><th style="width:5%">#</th><th style="width:35%">工作任务</th><th style="width:15%">状态</th><th style="width:20%">计划完成时间</th><th style="width:25%">分类</th></tr></thead><tbody id="year-tbody"></tbody></table></div>
  </div>

  <!-- 周例会任务 -->
  <div id="sec-week" class="section">
    <div class="cards-row c4">
      <div class="card c-blue"><div class="label">总任务</div><div class="num" id="week-total"></div></div>
      <div class="card c-green"><div class="label">已完成</div><div class="num" id="week-done"></div></div>
      <div class="card c-orange"><div class="label">进行中</div><div class="num" id="week-progress"></div></div>
      <div class="card c-red"><div class="label">已逾期</div><div class="num" id="week-overdue"></div></div>
    </div>
    <div class="charts-row">
      <div class="chart-box" id="week-pie"></div>
      <div class="chart-box" id="week-bar"></div>
    </div>
    <div class="filter-row" id="week-filters">
      <button class="filter-btn active-du" data-filter="全部">全部</button>
      <button class="filter-btn" data-filter="已完成">已完成</button>
      <button class="filter-btn" data-filter="进行中">进行中</button>
      <button class="filter-btn" data-filter="已逾期">已逾期</button>
    </div>
    <div class="table-wrap"><table><thead><tr><th style="width:5%">#</th><th style="width:30%">任务内容</th><th style="width:12%">状态</th><th style="width:15%">计划完成时间</th><th style="width:12%">负责人</th><th style="width:26%">细化措施</th></tr></thead><tbody id="week-tbody"></tbody></table></div>
  </div>

  <!-- 月例会任务 -->
  <div id="sec-month" class="section">
    <div class="cards-row c4">
      <div class="card c-blue"><div class="label">总任务</div><div class="num" id="month-total"></div></div>
      <div class="card c-green"><div class="label">已完成</div><div class="num" id="month-done"></div></div>
      <div class="card c-orange"><div class="label">进行中</div><div class="num" id="month-progress"></div></div>
      <div class="card c-red"><div class="label">已逾期</div><div class="num" id="month-overdue"></div></div>
    </div>
    <div class="charts-row">
      <div class="chart-box" id="month-pie"></div>
      <div class="chart-box" id="month-bar"></div>
    </div>
    <div class="filter-row" id="month-filters">
      <button class="filter-btn active-du" data-filter="全部">全部</button>
      <button class="filter-btn" data-filter="已完成">已完成</button>
      <button class="filter-btn" data-filter="进行中">进行中</button>
      <button class="filter-btn" data-filter="已逾期">已逾期</button>
    </div>
    <div class="table-wrap"><table><thead><tr><th style="width:5%">#</th><th style="width:30%">任务内容</th><th style="width:12%">状态</th><th style="width:15%">计划完成时间</th><th style="width:12%">责任部门</th><th style="width:26%">细化措施</th></tr></thead><tbody id="month-tbody"></tbody></table></div>
  </div>
</div>

<!-- ====== 运营台账看板 ====== -->
<div id="board-yy" class="board">
  <div class="sub-header">
    <div class="sub-nav">
      <button class="sub-btn yy active" data-section="sec-jx">检修清单</button>
      <button class="sub-btn yy" data-section="sec-qx">缺陷清单</button>
      <button class="sub-btn yy" data-section="sec-fx">服务风险</button>
      <button class="sub-btn yy" data-section="sec-xq">需求清单</button>
      <button class="sub-btn yy" data-section="sec-zt">运营主题</button>
    </div>
  </div>

  <!-- 检修清单 -->
  <div id="sec-jx" class="section active">
    <div class="cards-row c5">
      <div class="card c-blue"><div class="label">总任务</div><div class="num" id="jx-total"></div></div>
      <div class="card c-green"><div class="label">南中心通过</div><div class="num" id="jx-ns"></div></div>
      <div class="card c-teal"><div class="label">北中心通过</div><div class="num" id="jx-bt"></div></div>
      <div class="card c-orange"><div class="label">南中心其他</div><div class="num" id="jx-no"></div></div>
      <div class="card c-purple"><div class="label">北中心其他</div><div class="num" id="jx-bo"></div></div>
    </div>
    <div class="charts-row">
      <div class="chart-box" id="jx-pie-n"></div>
      <div class="chart-box" id="jx-pie-b"></div>
    </div>
    <div class="filter-row" id="jx-filters">
      <button class="filter-btn active-yy" data-filter="全部">全部</button>
      <button class="filter-btn" data-filter="南中心通过">南中心通过</button>
      <button class="filter-btn" data-filter="南中心不通过">南中心不通过</button>
      <button class="filter-btn" data-filter="南中心其他">南中心其他</button>
      <button class="filter-btn" data-filter="北中心通过">北中心通过</button>
      <button class="filter-btn" data-filter="北中心不通过">北中心不通过</button>
      <button class="filter-btn" data-filter="北中心其他">北中心其他</button>
    </div>
    <div class="table-wrap"><table><thead><tr><th>#</th><th>任务项</th><th>南中心验证结果</th><th>北中心验证结果</th></tr></thead><tbody id="jx-tbody"></tbody></table></div>
  </div>

  <!-- 缺陷清单 -->
  <div id="sec-qx" class="section">
    <div class="cards-row c4">
      <div class="card c-blue"><div class="label">总任务</div><div class="num" id="qx-total"></div></div>
      <div class="card c-green"><div class="label">已解决</div><div class="num" id="qx-done"></div></div>
      <div class="card c-orange"><div class="label">待发版</div><div class="num" id="qx-pend"></div></div>
      <div class="card c-purple"><div class="label">需求转出</div><div class="num" id="qx-out"></div></div>
    </div>
    <div class="charts-row">
      <div class="chart-box" id="qx-pie"></div>
      <div class="chart-box" id="qx-bar"></div>
    </div>
    <div class="filter-row" id="qx-filters">
      <button class="filter-btn active-yy" data-filter="全部">全部</button>
      <button class="filter-btn" data-filter="已解决">已解决</button>
      <button class="filter-btn" data-filter="待发版">待发版</button>
      <button class="filter-btn" data-filter="排查中">排查中</button>
      <button class="filter-btn" data-filter="需求转出">需求转出</button>
    </div>
    <div class="table-wrap"><table><thead><tr><th>#</th><th>问题名称</th><th>解决状态</th><th>渠道</th><th>问题类型</th></tr></thead><tbody id="qx-tbody"></tbody></table></div>
  </div>

  <!-- 服务风险 -->
  <div id="sec-fx" class="section">
    <div class="cards-row c3">
      <div class="card c-blue"><div class="label">总任务</div><div class="num" id="fx-total"></div></div>
      <div class="card c-green"><div class="label">已解决</div><div class="num" id="fx-done"></div></div>
      <div class="card c-orange"><div class="label">进行中</div><div class="num" id="fx-prog"></div></div>
    </div>
    <div class="charts-row">
      <div class="chart-box" id="fx-pie"></div>
      <div class="chart-box" id="fx-bar"></div>
    </div>
    <div class="filter-row" id="fx-filters">
      <button class="filter-btn active-yy" data-filter="全部">全部</button>
      <button class="filter-btn" data-filter="已解决">已解决</button>
      <button class="filter-btn" data-filter="进行中">进行中</button>
    </div>
    <div class="table-wrap"><table><thead><tr><th>#</th><th>问题名称</th><th>解决状态</th><th>服务事件分类</th></tr></thead><tbody id="fx-tbody"></tbody></table></div>
  </div>

  <!-- 需求清单 -->
  <div id="sec-xq" class="section">
    <div class="cards-row c4">
      <div class="card c-blue"><div class="label">总任务</div><div class="num" id="xq-total"></div></div>
      <div class="card c-green"><div class="label">技术评估</div><div class="num" id="xq-tech"></div></div>
      <div class="card c-orange"><div class="label">文档编制</div><div class="num" id="xq-doc"></div></div>
      <div class="card c-purple"><div class="label">研发中</div><div class="num" id="xq-dev"></div></div>
    </div>
    <div class="charts-row">
      <div class="chart-box" id="xq-pie"></div>
      <div class="chart-box" id="xq-bar"></div>
    </div>
    <div class="filter-row" id="xq-filters">
      <button class="filter-btn active-yy" data-filter="全部">全部</button>
      <button class="filter-btn" data-filter="技术评估中">技术评估中</button>
      <button class="filter-btn" data-filter="研发中">研发中</button>
      <button class="filter-btn" data-filter="文档编制">文档编制</button>
      <button class="filter-btn" data-filter="方案审核">方案审核</button>
    </div>
    <div class="table-wrap"><table><thead><tr><th>#</th><th>场景名称</th><th>完成情况</th><th>渠道</th></tr></thead><tbody id="xq-tbody"></tbody></table></div>
  </div>

  <!-- 运营主题 -->
  <div id="sec-zt" class="section">
    <div class="cards-row c3">
      <div class="card c-blue"><div class="label">总主题</div><div class="num" id="zt-total"></div></div>
      <div class="card c-green"><div class="label">已完成</div><div class="num" id="zt-done"></div></div>
      <div class="card c-orange"><div class="label">进行中</div><div class="num" id="zt-prog"></div></div>
    </div>
    <div class="charts-row">
      <div class="chart-box" id="zt-pie"></div>
      <div class="chart-box" id="zt-bar"></div>
    </div>
    <div class="filter-row" id="zt-filters">
      <button class="filter-btn active-yy" data-filter="全部">全部</button>
      <button class="filter-btn" data-filter="已完成">已完成</button>
      <button class="filter-btn" data-filter="进行中">进行中</button>
    </div>
    <div class="table-wrap"><table><thead><tr><th>#</th><th>当月主题</th><th>进度</th><th>月份</th></tr></thead><tbody id="zt-tbody"></tbody></table></div>
  </div>
</div>

<!-- 弹窗 -->
<div class="modal-overlay" id="modal">
  <div class="modal" id="modal-box">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h3 id="modal-title"></h3>
    <p id="modal-body"></p>
  </div>
</div>

<script>
// ========== 工具函数 ==========
const TC={'已完成':'tag-green','进行中':'tag-orange','已逾期':'tag-red','通过':'tag-green','不通过':'tag-red','其他':'tag-gray','已解决':'tag-green','待发版':'tag-orange','排查中':'tag-blue','需求转出':'tag-purple','技术评估中':'tag-blue','研发中':'tag-purple','文档编制':'tag-orange','方案审核':'tag-blue'};
function tc(s){return TC[s]||'tag-gray'}

function showModal(title,body,type){
  const box=document.getElementById('modal-box');
  box.className='modal '+type;
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').textContent=body||'暂无描述';
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal()});

function initChart(el){return echarts.init(el)}

function makePie(id,title,data){
  var c=initChart(document.getElementById(id));
  c.setOption({title:{text:title,left:'center',textStyle:{fontSize:15}},tooltip:{trigger:'item',formatter:'{b}: {c} ({d}%)'},legend:{bottom:5,textStyle:{fontSize:11}},series:[{type:'pie',radius:['35%','65%'],center:['50%','45%'],data:data,label:{show:false},emphasis:{label:{show:true,fontSize:13}}}]});
  return c;
}

function makeBar(id,title,xArr,yArr,color){
  var c=initChart(document.getElementById(id));
  c.setOption({title:{text:title,left:'center',textStyle:{fontSize:15}},tooltip:{trigger:'axis'},grid:{left:'3%',right:'8%',bottom:'3%',containLabel:true},xAxis:{type:'category',data:xArr,axisLabel:{rotate:30,interval:0,fontSize:11}},yAxis:{type:'value'},series:[{type:'bar',data:yArr,itemStyle:{color:color||'#1a73e8',borderRadius:[4,4,0,0]},barWidth:'60%'}]});
  return c;
}

function renderTable(tbodyId,data,cols,descKey,type){
  var tbody=document.getElementById(tbodyId);
  tbody.innerHTML='';
  data.forEach(function(d,i){
    var tr=document.createElement('tr');
    tr.className='clickable';
    var html='<td>'+(i+1)+'</td><td>'+d.name+'</td>';
    cols.forEach(function(c){html+='<td><span class="tag '+tc(d[c]||'')+'">'+(d[c]||'')+'</span></td>'});
    tr.innerHTML=html;
    tr.addEventListener('click',function(){showModal(d.name,d[descKey]||d.desc||d.detail||'暂无描述',type)});
    tbody.appendChild(tr);
  });
}

function setActive(container,cls){
  var btns=document.querySelectorAll('#'+container+' .filter-btn');
  btns.forEach(function(b){b.addEventListener('click',function(){
    btns.forEach(function(x){x.classList.remove('active-du');x.classList.remove('active-yy')});
    this.classList.add(cls);
  })});
}

// ========== 一级导航 ==========
document.querySelectorAll('.top-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.top-btn').forEach(function(b){b.classList.remove('active-du');b.classList.remove('active-yy')});
    document.querySelectorAll('.board').forEach(function(s){s.classList.remove('active')});
    var boardId=this.dataset.board;
    this.classList.add(boardId==='board-du'?'active-du':'active-yy');
    document.getElementById(boardId).classList.add('active');
    setTimeout(resizeAll,100);
  });
});

// ========== 二级导航 ==========
document.querySelectorAll('.sub-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    var parent=this.closest('.board');
    parent.querySelectorAll('.sub-btn').forEach(function(b){b.classList.remove('active')});
    parent.querySelectorAll('.section').forEach(function(s){s.classList.remove('active')});
    this.classList.add('active');
    document.getElementById(this.dataset.section).classList.add('active');
    setTimeout(resizeAll,100);
  });
});

function resizeAll(){
  document.querySelectorAll('.chart-box').forEach(function(el){
    var inst=echarts.getInstanceByDom(el);
    if(inst)inst.resize();
  });
}
window.addEventListener('resize',resizeAll);

// ========== 渲染：任务督办板块 ==========
function renderDU(prefix,data,colForBar,descKey){
  var done=data.filter(function(d){return d.status==='已完成'}).length;
  var prog=data.filter(function(d){return d.status==='进行中'}).length;
  var over=data.filter(function(d){return d.status==='已逾期'}).length;
  var total=data.length;
  document.getElementById(prefix+'-total').textContent=total;
  document.getElementById(prefix+'-done').textContent=done;
  document.getElementById(prefix+'-progress').textContent=prog;
  document.getElementById(prefix+'-overdue').textContent=over;

  makePie(prefix+'-pie','任务状态分布',[
    {value:done,name:'已完成',itemStyle:{color:'#34a853'}},
    {value:prog,name:'进行中',itemStyle:{color:'#fbbc04'}},
    {value:over,name:'已逾期',itemStyle:{color:'#ea4335'}}
  ]);

  var groups={};
  data.forEach(function(d){var k=d[colForBar]||'未分配';groups[k]=(groups[k]||0)+1});
  var sorted=Object.entries(groups).sort(function(a,b){return b[1]-a[1]});
  var barLabel=colForBar==='category'?'分类':colForBar==='person'?'负责人':'责任部门';
  makeBar(prefix+'-bar','按'+barLabel+'分布',sorted.map(function(s){return s[0]}),sorted.map(function(s){return s[1]}),'#1a73e8');

  renderTable(prefix+'-tbody',data,['status','planDate',colForBar],descKey,'du');

  setActive(prefix+'-filters','active-du');
  document.querySelectorAll('#'+prefix+'-filters .filter-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      var f=this.dataset.filter;
      var filtered=f==='全部'?data:data.filter(function(d){return d.status===f});
      renderTable(prefix+'-tbody',filtered,['status','planDate',colForBar],descKey,'du');
    });
  });
}
